# ConfigMap: Store Nginx configuration file
# This separates configuration from container image
# Allows configuration changes without rebuilding image
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: app-production
data:
  default.conf: |
    # Upstream Todo app backend
    upstream todo_app {
        server todo-app-service:5000;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 10M;

        # Serve static files from /usr/share/nginx/html
        location ~* \.(html|css|js|json|ico|png|jpg|jpeg|gif|svg)$ {
            root /usr/share/nginx/html;
            expires 1d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # API proxy to Todo app backend
        location /api/ {
            proxy_pass http://todo_app/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Serve index.html for all other routes (SPA routing)
        location / {
            root /usr/share/nginx/html;
            try_files $uri /index.html;
        }

        # Health check endpoint for Kubernetes probes
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
