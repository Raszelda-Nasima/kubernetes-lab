# Deployment: Run multiple Nginx replicas for high availability
# If one Nginx pod goes down, Kubernetes automatically spins up another
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: app-production
  labels:
    app: nginx
    tier: frontend
spec:
  replicas: 3  # Run 3 Nginx instances for load distribution
  selector:
    matchLabels:
      app: nginx
      tier: frontend
  template:
    metadata:
      labels:
        app: nginx
        tier: frontend
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80  # Nginx listens on port 80
        
        # Mount custom Nginx configuration
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d
        
        # Resource limits
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        
        # Liveness probe: restart if Nginx stops responding
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        
        # Readiness probe: only send traffic when ready
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
      
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-config
